<div class="mb-3 row">
  <label for="setting-{{.Field.Name}}" class="col-sm-3 col-form-label fw-semibold">
    {{.Field.Label}}{{if .Field.Required}} <span class="text-danger">*</span>{{end}}
    <div class="text-muted small fw-normal"><code>{{.Field.Name}}</code></div>
  </label>
  <div class="col-sm-9">
    <select class="form-select" id="setting-{{.Field.Name}}" name="{{.Field.Name}}"
      {{if .Field.Readonly}}disabled{{end}} {{if .Field.Required}}required{{end}}>
      {{range .Field.Options}}
      <option value="{{.Value}}" {{if eq .Value $.Value}}selected{{end}}>{{.Label}}</option>
      {{end}}
    </select>
    {{if .Field.Help}}<div class="form-text">{{.Field.Help}}</div>{{end}}
  </div>
</div>
